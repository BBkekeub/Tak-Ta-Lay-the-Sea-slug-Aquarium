<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oreo • Gene Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101e26;color:#e9f0ed;font:15px system-ui}main{max-width:1360px;margin:auto;padding:32px}h1{font-size:34px;margin:0}p{color:#a4b9be}header{margin-bottom:24px}.editor{display:grid;grid-template-columns:1fr 300px;gap:20px}.stage,.controls,article{background:#1b3039;border:1px solid #344a52;border-radius:18px;padding:18px}.stage canvas{width:100%;display:block}.controls label{display:flex;justify-content:space-between;font-size:13px}input{width:100%;accent-color:#b7dbc5;margin:5px 0 11px}button{background:#cce7d2;color:#153129;border:0;padding:10px 16px;border-radius:9px;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}article{cursor:pointer}article:hover{border-color:#cce7d2}article canvas{width:100%;display:block}article h3{margin:0;font-size:17px}small{color:#a8c2c9}#status{color:#e4c48b}a{color:#b7dbc5}@media(max-width:800px){.editor{grid-template-columns:1fr}#grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}</style>
<main><header><small>TAK TA LAY / SPECIES STUDY 02</small><h1>Oreo · ลองผสมยีน</h1><p>ฐานสีขาว • ลายแยกจากเนื้อตัว • เหงือกอยู่ด้านท้าย — คลิกตัวอย่างเพื่อปรับต่อ</p><small id="status">กำลังโหลดชิ้นส่วน…</small></header><section class="editor"><div class="stage"><canvas id="hero" width="1000" height="530"></canvas><button id="download">บันทึก PNG ตัวนี้</button> <button id="reset">กลับไปตัวขาวเริ่มต้น</button></div><div class="controls" id="controls"></div></section><h2>9 แบบให้เทียบ</h2><p>สีใช้ตารางเดิมของเครื่องมือ · สูตรลายเป็นข้อเสนอสำหรับ Oreo · ยังไม่เปลี่ยนเกมหลัก</p><section id="grid"></section></main>
<style>.pattern-panel{margin-top:20px;border-top:1px solid #48616a;padding-top:12px}.pattern-panel p{font-size:13px}.pattern-panel label{display:block;font-size:13px}#pattern-sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:16px}select{padding:9px;background:#213c46;color:white;border:1px solid #54747a;border-radius:8px}.pattern-panel output{float:right}</style>
<script src="pattern-editor.js"></script>
<script>
const $=s=>document.querySelector(s), base={mainC:200,accC:0,bodyDepth:45,gillDepth:45,len:50,girth:50,gillLen:50,tentLen:50,vigor:50,gillN:20,spotN:70};let genes={...base}, data,assets;const cache=new Map();
const fields=[['mainC','สีตัว',400],['accC','สีเหงือก / ปลายหนวด',400],['bodyDepth','ร่องสีตัว',100],['gillDepth','ร่องเหงือก',100],['len','ความยาวตัว',100],['girth','ขนาดตัวรวม',100],['gillLen','ความยาวเหงือก',100],['tentLen','ความยาวหนวด',100],['vigor','ประกาย',100],['gillN','ยีนจำนวนเหงือก',100],['spotN','จำนวนลาย Oreo',100]];
const presets=[['01 · Original Oreo',{}],['02 · Snow',{accC:200,spotN:30}],['03 · Rose Milk',{mainC:150,accC:100,gillN:30}],['04 · Blue Ice',{mainC:250,accC:50,len:70}],['05 · Mint Cream',{mainC:300,accC:250,spotN:90}],['06 · Apricot',{mainC:350,accC:100,gillLen:35}],['07 · Plum Velvet',{mainC:50,accC:150,bodyDepth:65}],['08 · Little Round',{len:10,girth:25,tentLen:25,gillLen:30,gillN:50,spotN:45}],['09 · Golden Crown',{mainC:400,accC:350,gillN:0,gillLen:75,vigor:90}]];
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);const clamp=v=>Math.max(0,Math.min(1,v));
function palette(kind,v){const a=data[kind].anchors;let lo=a[0],hi=a.at(-1);for(let i=1;i<a.length;i++)if(v<=a[i].gene){lo=a[i-1];hi=a[i];break}const t=clamp((v-lo.gene)/(hi.gene-lo.gene||1));return Object.fromEntries(['D','M','L'].map(k=>[k,mix(lo[k],hi[k],t)]))}
async function load(src){const im=new Image();im.src=src;await im.decode();const c=canvas(im.width,im.height),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height);let l=c.width,r=0,t=c.height,b=0;for(let y=0;y<c.height;y++)for(let z=0;z<c.width;z++){if(d.data[(y*c.width+z)*4+3]>220){l=Math.min(l,z);r=Math.max(r,z);t=Math.min(t,y);b=Math.max(b,y)}}if(r<l)throw Error('Empty asset: '+src);const out=canvas(r-l+1,b-t+1);out.getContext('2d').drawImage(c,l,t,out.width,out.height,0,0,out.width,out.height);return out}
const tonalRanges=new WeakMap();
function tonalRange(src){if(tonalRanges.has(src))return tonalRanges.get(src);const x=src.getContext('2d'),d=x.getImageData(0,0,src.width,src.height).data,h=new Uint32Array(256);let n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>240){h[Math.round(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)]++;n++}let sum=0,lo=0,hi=255;for(let i=0;i<256;i++){sum+=h[i];if(sum<n*.05)lo=i;if(sum<n*.97)hi=i}const r=[lo/255,Math.max(.04,(hi-lo)/255)];tonalRanges.set(src,r);return r}
function tint(part,g){const color=part==='body'?g.mainC:g.accC,depth=part==='body'?g.bodyDepth:g.gillDepth,key=[part,color,depth,g.mainC].join('/');if(cache.has(key))return cache.get(key);const src=assets[part],c=canvas(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,c.width,c.height),p=palette(part==='body'?'body':'gill',color),bp=palette('body',g.mainC);for(let i=0;i<d.data.length;i+=4){let a=d.data[i+3]/255;if(!a)continue;const lum=(d.data[i]*.2126+d.data[i+1]*.7152+d.data[i+2]*.0722)/255;const range=part==='gill'?tonalRange(src):null;const normalized=range?clamp((lum-range[0])/range[1]):lum;let v=part==='gill'?(color===200?Math.pow(lum,1+depth/100*.7):.12+.66*Math.pow(normalized,.8+depth/100*1.5)):Math.pow(lum,1+depth/100*1.8),rgb=v<.5?mix(p.D,p.M,v*2):mix(p.M,p.L,(v-.5)*2);if(part==='horn'){const y=Math.floor(i/4/c.width)/c.height;const tip=rgb.map(n=>n*.28);const body=v<.5?mix(bp.D,bp.M,v*2):mix(bp.M,bp.L,(v-.5)*2);rgb=mix(tip,body,clamp((y-.60)/.18))}if(part==='gill')a=clamp((a-.82)/.18);for(let k=0;k<3;k++)d.data[i+k]=rgb[k];d.data[i+3]=a*255}x.putImageData(d,0,0);if(cache.size>55)cache.delete(cache.keys().next().value);cache.set(key,c);return c}
const bodyCache=new Map();
function bodyLayer(g){const key=JSON.stringify([g.mainC,g.bodyDepth,g.spotN,g.vigor,OreoPattern.revision]);if(bodyCache.has(key))return bodyCache.get(key);const c=canvas(800,240),x=c.getContext('2d');x.drawImage(tint('body',g),0,0,800,240);x.save();x.globalCompositeOperation='source-atop';x.drawImage(OreoPattern.layer(Math.round(g.spotN*.08),g.mainC<75),0,0);for(let i=0;i<Math.round(g.vigor*.35);i++){x.fillStyle='#ffffff88';x.fillRect(80+(i*137%630),45+(i*67%130),1.5,1.5)}x.restore();if(bodyCache.size>=20)bodyCache.delete(bodyCache.keys().next().value);bodyCache.set(key,c);return c}
function render(target,g){const x=target.getContext('2d');x.clearRect(0,0,target.width,target.height);x.save();x.scale(target.width/1000,target.height/530);const size=.72+g.girth*.0056,stretch=.72+g.len*.0056,w=650*size*stretch,h=195*size,left=(1000-w)/2,top=350-h;const body=bodyLayer(g),frond=tint('gill',g),horn=tint('horn',g),n=[2,3,5,6,8,9][Math.min(5,Math.floor(Math.abs(g.gillN-50)/10))];function append(im,bx,by,height,angle){x.save();x.translate(bx,by);x.rotate(angle);const width=height*im.width/im.height;x.drawImage(im,-width*.5,-height,width,height);x.restore()}const gx=left+w*.24,gy=top+h*.30;for(let i=0;i<n;i++)append(frond,gx+(i%2?7:-7)*size,gy,125*size*(.62+g.gillLen*.0076)*(1-(i%3)*.1),n===1?0:(i/(n-1)-.5)*1.35);append(horn,left+w*.91,top+h*.30,69*size*(.62+g.tentLen*.0076),.25);x.drawImage(body,left,top,w,h);append(horn,left+w*.86,top+h*.41,71*size*(.62+g.tentLen*.0076),-.12);x.fillStyle='#10151c';x.beginPath();x.ellipse(left+w*.944,top+h*.51,4.6*size,5*size,0,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(left+w*.945-1,top+h*.50,1.4*size,0,7);x.fill();x.restore();return n}
function refresh(){for(const [k]of fields){$('#'+k).value=genes[k];$('#v_'+k).textContent=genes[k]}const n=render($('#hero'),genes);OreoPattern.guides($('#hero'),genes);$('#status').textContent=`เหงือก ${n} ก้าน · ลาย ${Math.round(genes.spotN*.08)} วง · ภาพร่างประกอบชิ้นส่วน — กำลังทดลองขอบเหงือก`;window.oreoState={...genes,nGill:n};}
async function init(){data=await(await fetch('color-data.json')).json();assets={body:await load('body-white-v1.png'),horn:await load('rhinophore-white-v1.png'),gill:await load('gill-white-v1.png')};for(const [k,name,max]of fields){const wrap=document.createElement('div');wrap.innerHTML=`<label for="${k}">${name}<span id="v_${k}"></span></label><input id="${k}" type="range" min="0" max="${max}" step="${max===400?10:1}">`;$('#controls').append(wrap);$('#'+k).oninput=e=>{genes[k]=+e.target.value;refresh()}}for(const [name,patch]of presets){const g={...base,...patch},card=document.createElement('article'),c=canvas(600,318);card.innerHTML=`<h3>${name}</h3><small>ตัว ${g.mainC} · เหงือก ${g.accC} · ลาย ${g.spotN}</small>`;card.append(c);render(c,g);card.onclick=()=>{genes={...g};refresh()};$('#grid').append(card)}$('#reset').onclick=()=>{genes={...base};refresh()};$('#download').onclick=()=>{const a=document.createElement('a');a.download='oreo-gene-variant.png';const out=canvas(1000,530);render(out,genes);a.href=out.toDataURL();a.click()};OreoPattern.init();refresh();window.oreoReady=true}init().catch(e=>{$('#status').textContent='โหลดไม่สำเร็จ: '+e.message;console.error(e)});
</script></html>
