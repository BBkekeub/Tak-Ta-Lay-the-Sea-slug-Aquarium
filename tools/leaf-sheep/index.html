<main><section id="view"><div id="caption">ลากเพื่อหมุน · เลื่อนเพื่อซูม<br><small>ลำตัวเดิม + ชุดใบใหม่</small></div></section><aside><small>SPECIES STUDY / 01</small><h1>แกะทะเล<br>สวนใบเล็ก ๆ บนหลัง</h1><p>ใบอวบปลายครีม เรียงเป็นคู่ เว้นหัวให้เห็นหน้า</p><label>จำนวนใบ <select id="count"><option>18</option><option selected>30</option><option>42</option></select></label><label>ความยาวใบ <input id="length" type="range" min="65" max="140" value="100"></label><label>สีใบ <input id="color" type="color" value="#88b858"></label><label><input id="motion" type="checkbox"> ใบไหวเบา ๆ</label><label><input id="wire" type="checkbox"> ดูโครงสามเหลี่ยม</label><button id="turn">หมุน 90°</button> <button id="reset">มุมเริ่มต้น</button><p id="stats">กำลังโหลดลำตัว…</p><small>ต้นแบบแยก ยังไม่เปลี่ยนทากในเซฟ<br>ตัวเลขใบไม่รวมลำตัวเดิม</small><p id="error" role="alert"></p></aside></main><script type="module" src="prototype.js"></script></html>
